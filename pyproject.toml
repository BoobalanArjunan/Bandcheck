[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bandcheck"
dynamic = ["version"]
description = "Find audio files whose real frequency range is lower than their sample rate claims (upsampled or lossy-encoded)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "Boobalan Arjunan", email = "boobalan_arjunan@composermind.com" },
]
maintainers = [
  { name = "Boobalan Arjunan", email = "boobalan_arjunan@composermind.com" },
]
dependencies = ["numpy>=1.23", "scipy>=1.9", "soundfile>=0.12"]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Topic :: Multimedia :: Sound/Audio :: Analysis"]

[project.urls]
Homepage = "https://github.com/BoobalanArjunan/Bandcheck"
Issues = "https://github.com/BoobalanArjunan/Bandcheck/issues"
Source = "https://github.com/BoobalanArjunan/Bandcheck"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
bandcheck = "bandcheck.cli:main"

[tool.setuptools.dynamic]
version = { attr = "bandcheck._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
